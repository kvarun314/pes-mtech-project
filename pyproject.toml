[project]
name = "agentic-sentiment"
version = "0.1.0"
description = "Phase 2 agentic sentiment pipeline (pes-mtech-project)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5.0",
    "scikit-learn>=1.2.0",
    "langgraph>=0.2.0",
    "lancedb>=0.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]
colab = [
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "peft>=0.7.0",
    "datasets>=2.14.0",
    "accelerate>=0.25.0",
    "textblob>=0.17.0",
    "sentence-transformers>=3.0.0",
    "xgboost",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_sentiment"]

[tool.pytest.ini_options]
# Independent of the editable install, which macOS/Python 3.13 can skip
# loading (treats the generated _editable_impl_*.pth as a hidden file).
pythonpath = ["src"]

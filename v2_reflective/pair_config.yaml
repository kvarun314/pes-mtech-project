model: v2_reflective/mlx_model
train: true
data: v2_reflective/pair_data
adapter_path: v2_reflective/pair_adapter
num_layers: 8
batch_size: 2
iters: 1500
val_batches: 25
learning_rate: 1.0e-4
steps_per_report: 50
